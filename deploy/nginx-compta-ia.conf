# Configuration Nginx - Compta-IA
# Sert le frontend compile (fichiers statiques) et redirige /api vers le
# backend FastAPI local. Meme origine cote navigateur => aucune config CORS
# necessaire (le frontend appelle deja des chemins relatifs "/api/...").
server {
    listen 80 default_server;
    server_name _;   # remplacer par votre nom de domaine si vous en avez un

    # Correspond a settings.max_upload_size_mb (15 Mo) cote backend, avec
    # une petite marge.
    client_max_body_size 20M;

    root /opt/compta-ia/frontend/dist;
    index index.html;

    # Fichiers statiques (JS/CSS/images) : cache long, le hash dans le nom
    # de fichier genere par Vite gere l'invalidation.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Application React (SPA) : toute route inconnue retombe sur index.html,
    # c'est react-router qui gere la navigation cote client.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API backend
    location /api/ {
        proxy_pass http://127.0.0.1:9000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Le traitement d'une facture (OCR + IA) peut prendre plusieurs
        # dizaines de secondes ; eviter un timeout premature de Nginx sur
        # les requetes longues (upload, reprocess). Delai eleve car un
        # e2-micro (1 vCPU partage) execute EasyOCR bien plus lentement
        # qu'une VM dediee.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}

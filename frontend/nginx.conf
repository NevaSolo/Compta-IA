# Config Nginx embarquée dans le conteneur frontend.
# "backend" est résolu par le DNS interne de Docker Compose (nom du service),
# pas besoin d'adresse IP ni de host.docker.internal.
server {
    listen 80 default_server;
    server_name _;

    # Correspond à settings.max_upload_size_mb (15 Mo) côté backend, avec
    # une petite marge.
    client_max_body_size 20M;

    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Application React (SPA) : toute route inconnue retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:9000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Le traitement d'une facture (OCR + IA) peut prendre plusieurs
        # dizaines de secondes ; éviter un timeout prématuré de Nginx.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
